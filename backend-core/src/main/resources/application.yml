server:
  port: 8081

spring:
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  application:
    name: backend-core
  datasource:
    url: jdbc:postgresql://localhost:5432/unihub_db
    username: admin
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6381 # Using redis-lock as primary for business logic
    rabbitmq:
      host: localhost
      port: 5672
      username: guest
      password: guest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/unihub

resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 4
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 2
        minimumNumberOfCalls: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true

app:
  frontend-base-url: http://localhost:3000
  payment:
    sandbox-base-url: http://localhost:8090
    webhook-url: http://localhost:8081/api/payments/webhook
    webhook-secret: dev-payment-secret
